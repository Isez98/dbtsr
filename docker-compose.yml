version: '3.9'
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: dbtsr
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 3

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
      network: host
    ports:
      - "4000:4000"
    environment:
      OCR_URL: "http://ocr:9000"
      DBTSR_DB_DSN: "postgres://postgres:postgres@db:5432/dbtsr?sslmode=disable"
    depends_on:
      db:
        condition: service_healthy
      ocr:
        condition: service_started

  ocr:
    build:
      context: ./ocr
      dockerfile: Dockerfile
      network: host
    ports:
      - "9000:9000"
    environment:
      HF_HUB_DISABLE_TELEMETRY: "1"
    volumes:
      - ./ocr/templates:/app/templates:ro
    devices:
      - "/dev/kfd:/dev/kfd"
      - "/dev/dri:/dev/dri"

volumes:
  postgres_data: